<style>
:root {
  --cream:#f8ead7; --brown:#6b351e; --gold:#b7833e; --pink:#dca59c;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#fbf0df,#f4dfcf);font-family:Georgia,serif;color:var(--brown);min-height:100vh}
.wrap{max-width:1100px;margin:auto;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 5px;font-size:clamp(24px,4vw,40px)}
p{margin:6px 0 18px}
#status{font-weight:bold;margin:10px 0 16px}
#game{position:relative;margin:auto;width:min(92vw,720px);aspect-ratio:1/1;border:3px solid var(--gold);border-radius:14px;background:#ead8c0;box-shadow:0 8px 25px #6b351e22;overflow:hidden}
.slot{position:absolute;border:1px dashed #b7833e55;background:#fff3;}
.piece{position:absolute;cursor:grab;border:1px solid #fff9;box-shadow:0 3px 8px #0003;background-repeat:no-repeat;background-size:500% 900%;touch-action:none;user-select:none}
.piece.dragging{cursor:grabbing;z-index:999;box-shadow:0 10px 22px #0005}
button{border:0;border-radius:999px;padding:11px 18px;background:var(--brown);color:white;font-size:15px;cursor:pointer;margin:3px}
button:hover{filter:brightness(1.08)}
#win{display:none;margin:18px auto 0;padding:16px;border-radius:14px;background:#fff7;color:var(--brown);font-size:20px;font-weight:bold}
small{opacity:.75}
</style>

const COLS=5, ROWS=9, N=45;
const game=document.getElementById('game');
let solved=0, pieces=[];

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function newGame(){
  game.innerHTML=''; solved=0; pieces=[];
  document.getElementById('status').textContent='0 / 45 peças encaixadas';
  document.getElementById('win').style.display='none';

  const rect=game.getBoundingClientRect();
  const W=rect.width, H=rect.height;
  const pw=W/COLS, ph=H/ROWS;

  // slots
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const s=document.createElement('div'); s.className='slot';
    s.style.left=(c*pw)+'px'; s.style.top=(r*ph)+'px';
    s.style.width=pw+'px'; s.style.height=ph+'px';
    game.appendChild(s);
  }

  const order=shuffle([...Array(N).keys()]);
  order.forEach((id,k)=>{
    const r=Math.floor(id/COLS), c=id%COLS;
    const p=document.createElement('div'); p.className='piece';
    p.dataset.id=id;
    p.style.width=pw+'px'; p.style.height=ph+'px';
    p.style.backgroundImage=`url(${img})`;
    p.style.backgroundPosition=`${c*25}% ${r*12.5}%`;

    // Start pieces in randomized positions, avoiding the exact target positions.
    const margin=4;
    let x=Math.random()*(W-pw-margin*2)+margin;
    let y=Math.random()*(H-ph-margin*2)+margin;
    if(Math.abs(x-c*pw)<pw*.65 && Math.abs(y-r*ph)<ph*.65){
      x=(x+pw*1.4)%Math.max(1,W-pw);
      y=(y+ph*1.4)%Math.max(1,H-ph);
    }
    p.style.left=x+'px'; p.style.top=y+'px';

    let startX=0,startY=0,origX=0,origY=0,drag=false;
    p.addEventListener('pointerdown',e=>{
      if(p.dataset.done) return;
      drag=true; p.classList.add('dragging'); p.setPointerCapture(e.pointerId);
      startX=e.clientX; startY=e.clientY;
      origX=parseFloat(p.style.left); origY=parseFloat(p.style.top);
    });
    p.addEventListener('pointermove',e=>{
      if(!drag) return;
      const nx=origX+(e.clientX-startX), ny=origY+(e.clientY-startY);
      p.style.left=Math.max(0,Math.min(W-pw,nx))+'px';
      p.style.top=Math.max(0,Math.min(H-ph,ny))+'px';
    });
    p.addEventListener('pointerup',e=>{
      if(!drag) return; drag=false; p.classList.remove('dragging');
      const tx=c*pw, ty=r*ph;
      const px=parseFloat(p.style.left), py=parseFloat(p.style.top);
      const tolerance=Math.min(pw,ph)*0.22;
      if(Math.abs(px-tx)<tolerance && Math.abs(py-ty)<tolerance){
        p.style.left=tx+'px'; p.style.top=ty+'px'; p.dataset.done='1';
        p.style.cursor='default'; p.style.boxShadow='none'; p.style.zIndex=10;
        solved++;
        document.getElementById('status').textContent=solved+' / 45 peças encaixadas';
        if(solved===N) document.getElementById('win').style.display='block';
      }
    });
    game.appendChild(p); pieces.push(p);
  });
}
window.addEventListener('load',newGame);
window.addEventListener('resize',()=>{ if(!pieces.length)return; });
</script>
